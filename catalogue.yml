
- name: Setup Catalogue Component
  hosts: all
  become: yes

  tasks:
    - name: Create application user
      ansible.builtin.user:
        name: appuser
        system: yes
        shell: /sbin/nologin
        create_home: no

    - name: Install GoLang and Git
      ansible.builtin.dnf:
        name:
          - golang
          - git
        state: present

    - name: Install MySQL Client
      ansible.builtin.dnf:
        name: mysql
        state: present

    - name: Remove existing application directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: Create application directory
      ansible.builtin.file:
        path: /app
        state: directory
        owner: appuser
        group: appuser
        mode: "0755"

    - name: Download application content
      ansible.builtin.unarchive:
        src: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/catalogue.zip
        dest: /app
        remote_src: yes

    - name: Copy systemd service file
      ansible.builtin.copy:
        src: catalogue.service
        dest: /etc/systemd/system/catalogue.service
        owner: root
        group: root
        mode: "0644"

    - name: Load schema
      ansible.builtin.shell: |
        mysql -h 172.16.2.4 -u root -pRoboShop@1 < db/schema.sql
      args:
        chdir: /app

    - name: Load app user
      ansible.builtin.shell: |
        mysql -h 172.16.2.4 -u root -pRoboShop@1 < db/app-user.sql
      args:
        chdir: /app

    - name: Load master data
      ansible.builtin.shell: |
        mysql -h 172.16.2.4 -u root -pRoboShop@1 catalogue < db/master-data.sql
      args:
        chdir: /app

    - name: Download Go modules
      ansible.builtin.shell: go mod tidy
      args:
        chdir: /app

    - name: Build catalogue application
      ansible.builtin.shell: CGO_ENABLED=0 go build -o /app/catalogue .
      args:
        chdir: /app

    - name: Set application permissions
      ansible.builtin.file:
        path: /app
        owner: appuser
        group: appuser
        recurse: yes

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Enable and start catalogue service
      ansible.builtin.systemd:
        name: catalogue
        enabled: yes
        state: restarted